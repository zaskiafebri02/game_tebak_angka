<script>
const angkaBenar = Math.floor(Math.random() * 100) + 1;
let percobaan = 0;
const tombol = document.querySelector('button');
tombol.onclick = function() {
    percobaan++;
    const tebakan = document.getElementById('tebakan').value;
    const hasil = document.getElementById('hasil');
    if (tebakan < angkaBenar) {
        hasil.textContent = "Terlalu Kecil! Percobaan: " + percobaan;
    } else if (tebakan > angkaBenar) {
        hasil.textContent = "Terlalu Besar! Percobaan: " + percobaan;
    } else {
        hasil.textContent = "✅ BENAR dalam " + percobaan + " kali percobaan!";
    }
}
</script>
